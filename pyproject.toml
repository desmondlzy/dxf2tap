[project]
name = "dxf2tap"
version = "0.1.0"
description = "Convert a DXF into a SwiftCut plasma program (.tap), leads placed automatically"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Desmond Liu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "ezdxf>=1.4",
    "shapely>=2.1.2",
    "matplotlib>=3.11.1",
    "tyro>=1.0.15",
]

[project.scripts]
dxf2tap = "dxf2tap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dxf2tap"]
